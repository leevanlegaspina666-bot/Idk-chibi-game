name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT YOUR PROJECT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      # ============================================================
      # 5. INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"


      # ============================================================
      # 6. CHECK HOST TOOLS
      # ============================================================

      - name: Check build environment
        run: |
          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version


      # ============================================================
      # 7. CLEAN ALL PREVIOUS BUILDS
      #
      # This is important because your previous failed p4a build
      # created the corrupted build/venv that caused the error.
      # ============================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf p4a-local


      # ============================================================
      # 8. DOWNLOAD FIXED PYTHON-FOR-ANDROID
      #
      # 5865575 is the upstream commit that removed the problematic
      # temporary Python venv from the package-install stage.
      # ============================================================

      - name: Download fixed python-for-android
        run: |
          echo "========================================"
          echo "DOWNLOADING PYTHON-FOR-ANDROID"
          echo "========================================"

          git clone \
            --filter=blob:none \
            https://github.com/kivy/python-for-android.git \
            p4a-local

          cd p4a-local

          git checkout 5865575

          echo
          echo "========================================"
          echo "P4A COMMIT BEING USED"
          echo "========================================"

          git rev-parse HEAD

          echo
          echo "Expected:"
          echo "5865575"


      # ============================================================
      # 9. VERIFY THE FIXED P4A SOURCE
      #
      # We intentionally DO NOT patch the file.
      #
      # We verify that the checked-out version does not contain the
      # old temporary-venv package-install sequence.
      # ============================================================

      - name: Verify fixed python-for-android
        run: |
          set -e

          cd p4a-local

          echo "========================================"
          echo "VERIFYING P4A"
          echo "========================================"

          COMMIT="$(git rev-parse HEAD)"

          echo "Actual commit:"
          echo "$COMMIT"

          if [ "$COMMIT" != "5865575" ]; then
            echo "ERROR: Wrong p4a commit."
            exit 1
          fi

          echo
          echo "Checking build.py..."

          test -f pythonforandroid/build.py

          echo
          echo "Checking for old pip self-upgrade..."

          if grep -q "pip install -U pip" \
            pythonforandroid/build.py; then

            echo "ERROR: Old pip self-upgrade still exists."
            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "The selected p4a version does not contain"
          echo "the problematic pip self-upgrade."


      # ============================================================
      # 10. TELL BUILDOZER TO USE THAT EXACT P4A CHECKOUT
      # ============================================================

      - name: Configure Buildozer p4a source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit(
                  "ERROR: buildozer.spec was not found."
              )

          text = path.read_text()

          lines = []

          for line in text.splitlines():

              # Remove an old p4a.source_dir if one exists.
              if line.strip().startswith("p4a.source_dir"):
                  continue

              # Remove old p4a.commit if one exists.
              if line.strip().startswith("p4a.commit"):
                  continue

              lines.append(line)

          lines.append("")
          lines.append("# GitHub Actions: fixed python-for-android")
          lines.append("p4a.source_dir = ./p4a-local")

          path.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          echo
          echo "========================================"
          echo "BUILDOZER P4A CONFIGURATION"
          echo "========================================"

          grep -n "p4a." buildozer.spec


      # ============================================================
      # 11. PIP SETTINGS
      # ============================================================

      - name: Configure pip
        run: |
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=1" >> "$GITHUB_ENV"


      # ============================================================
      # 12. CHECK YOUR PROJECT
      # ============================================================

      - name: Check project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo
          echo "main.py:"
          ls -lh main.py

          echo
          echo "buildozer.spec:"
          ls -lh buildozer.spec

          echo
          echo "Assets:"
          find assets -maxdepth 1 -type f -print | sort

          echo
          echo "Image count:"

          find assets -maxdepth 1 -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
            \) | wc -l


      # ============================================================
      # 13. BUILD APK
      # ============================================================

      - name: Build Android APK
        run: |
          echo "========================================"
          echo "STARTING ANDROID BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # 14. FIND APK
      # ============================================================

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "No bin directory was created."
          fi


      # ============================================================
      # 15. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
