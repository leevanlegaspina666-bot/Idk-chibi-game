```yaml
name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"


      - name: Configure buildozer.spec
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit("buildozer.spec not found")

          text = path.read_text()

          lines = []

          for line in text.splitlines():

              if line.strip().startswith("p4a.source_dir"):
                  continue

              if line.strip().startswith("p4a.commit"):
                  continue

              lines.append(line)

          output = []

          inserted = False

          for line in lines:

              output.append(line)

              if line.strip() == "p4a.branch = master":

                  output.append(
                      "p4a.commit = 5865575"
                  )

                  inserted = True

          if not inserted:
              raise SystemExit(
                  "Could not find 'p4a.branch = master'"
              )

          path.write_text(
              "\n".join(output) + "\n"
          )
          PY

          echo
          echo "P4A SETTINGS:"
          grep -n "p4a." buildozer.spec


      - name: Verify project
        run: |
          set -e

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo "main.py: OK"
          echo "buildozer.spec: OK"
          echo "assets: OK"

          echo
          echo "Number of image assets:"

          find assets -maxdepth 1 -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
            \) | wc -l


      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      - name: Configure pip
        run: |
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=1" >> "$GITHUB_ENV"


      - name: Build Android APK
        run: |
          echo "========================================"
          echo "BUILDING CHIBI SHARK PET"
          echo "========================================"

          buildozer -v android debug


      - name: Verify p4a commit
        if: always()
        run: |
          echo "========================================"
          echo "P4A VERSION USED BY BUILDOZER"
          echo "========================================"

          P4A=".buildozer/android/platform/python-for-android"

          if [ -d "$P4A/.git" ]; then

            COMMIT="$(git -C "$P4A" rev-parse HEAD)"

            echo "P4A commit:"
            echo "$COMMIT"

            if [[ "$COMMIT" == 5865575* ]]; then
              echo "CORRECT P4A COMMIT"
            else
              echo "WRONG P4A COMMIT"
            fi

          else

            echo "P4A checkout was not created."

          fi


      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "No bin directory."
          fi


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
```
