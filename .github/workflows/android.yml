name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"


      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf p4a-local


      - name: Download fixed python-for-android
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING PYTHON-FOR-ANDROID"
          echo "========================================"

          git clone \
            https://github.com/kivy/python-for-android.git \
            p4a-local

          cd p4a-local

          git checkout 5865575d81d53617784428ee29f57be2716311ea

          echo
          echo "P4A COMMIT:"
          git rev-parse HEAD


      - name: Verify fixed python-for-android
        run: |
          set -e

          cd p4a-local

          COMMIT="$(git rev-parse HEAD)"

          echo "========================================"
          echo "P4A COMMIT"
          echo "========================================"

          echo "$COMMIT"

          if [ "$COMMIT" != "5865575d81d53617784428ee29f57be2716311ea" ]; then
            echo "ERROR: Wrong p4a commit."
            exit 1
          fi

          echo
          echo "Correct p4a commit confirmed."


      - name: Check project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo "main.py: OK"
          echo "buildozer.spec: OK"
          echo "assets: OK"

          echo
          echo "Asset count:"

          find assets -maxdepth 1 -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
            \) | wc -l


      - name: Show Buildozer configuration
        run: |
          echo "========================================"
          echo "BUILDOZER CONFIGURATION"
          echo "========================================"

          grep -n "android.api" buildozer.spec
          grep -n "android.minapi" buildozer.spec
          grep -n "android.ndk" buildozer.spec
          grep -n "android.ndk_api" buildozer.spec

          echo
          echo "P4A CONFIGURATION"

          grep -n "p4a\." buildozer.spec


      - name: Verify NDK configuration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NDK"
          echo "========================================"

          NDK_LINE="$(grep '^android.ndk =' buildozer.spec)"

          echo "$NDK_LINE"

          if ! echo "$NDK_LINE" | grep -q "28c"; then
            echo "ERROR: NDK is not set to 28c."
            exit 1
          fi

          echo
          echo "NDK 28c confirmed."


      - name: Build Android APK
        run: |
          set -e

          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          buildozer -v android debug


      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "No bin directory was created."
          fi


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
