name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # GET PROJECT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # JAVA
      # ======================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ======================================================
      # BUILD DEPENDENCIES
      # ======================================================

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.4"
          python -m pip install buildozer


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build debug APK
        run: |
          buildozer -v android debug


      # ======================================================
      # FIND APK
      # ======================================================

      - name: List build output
        run: |
          echo "Build output:"
          find bin -type f -maxdepth 2 -print


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
