```yaml
name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.11
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      # ===========================================================
      # 5. INSTALL BUILDOZER
      # ===========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"


      # ============================================================
      # 6. CHECK BUILD ENVIRONMENT
      # ============================================================

      - name: Check build environment
        run: |
          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version


      # ============================================================
      # 7. CLEAN OLD BUILDS
      # ============================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ============================================================
      # 8. FORCE BUILDOZER TO USE FIXED P4A
      #
      # Commit:
      # 5865575d81d53617784428ee29f57be2716311ea
      #
      # "Remove venv creation for python package install stage"
      #
      # IMPORTANT:
      # We let Buildozer perform the checkout itself.
      # ============================================================

      - name: Configure fixed python-for-android
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit(
                  "ERROR: buildozer.spec was not found."
              )

          text = path.read_text()

          lines = []

          for line in text.splitlines():

              # Remove anything previously added for p4a source.
              if line.strip().startswith("p4a.source_dir"):
                  continue

              # Remove an old p4a.commit so we can replace it.
              if line.strip().startswith("p4a.commit"):
                  continue

              lines.append(line)

          # Find the [app] section and insert p4a.commit there.
          output = []
          inserted = False

          for line in lines:

              output.append(line)

              if (
                  line.strip() == "p4a.branch = master"
                  and not inserted
              ):
                  output.append(
                      "p4a.commit = 5865575"
                  )
                  inserted = True

          if not inserted:
              raise SystemExit(
                  "ERROR: Could not find "
                  "'p4a.branch = master' in buildozer.spec."
              )

          path.write_text(
              "\n".join(output) + "\n"
          )
          PY

          echo
          echo "========================================"
          echo "P4A CONFIGURATION"
          echo "========================================"

          grep -n "p4a." buildozer.spec


      # ============================================================
      # 9. VERIFY PROJECT
      # ============================================================

      - name: Check project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo
          echo "main.py:"
          ls -lh main.py

          echo
          echo "buildozer.spec:"
          ls -lh buildozer.spec

          echo
          echo "Asset count:"

          find assets -maxdepth 1 -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
            \) | wc -l


      # ============================================================
      # 10. CONFIGURE PIP
      # ============================================================

      - name: Configure pip
        run: |
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=1" >> "$GITHUB_ENV"


      # ============================================================
      # 11. BUILD APK
      # ============================================================

      - name: Build Android APK
        run: |
          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # 12. VERIFY WHICH P4A WAS ACTUALLY USED
      # ============================================================

      - name: Verify built p4a
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "CHECKING BUILDOZER P4A"
          echo "========================================"

          P4A_DIR=".buildozer/android/platform/python-for-android"

          if [ -d "$P4A_DIR/.git" ]; then

            echo
            echo "P4A directory found:"
            echo "$P4A_DIR"

            echo
            echo "Actual p4a commit:"

            git -C "$P4A_DIR" rev-parse HEAD

            echo
            echo "Expected commit prefix:"
            echo "5865575"

            COMMIT="$(git -C "$P4A_DIR" rev-parse HEAD)"

            if [[ "$COMMIT" == 5865575* ]]; then
              echo
              echo "SUCCESS: Buildozer used the fixed p4a commit."
            else
              echo
              echo "WARNING: Buildozer did not use commit 5865575."
            fi

          else

            echo "P4A directory was not created."

          fi


      # ============================================================
      # 13. FIND APK
      # ============================================================

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then

            find bin \
              -type f \
              -name "*.apk" \
              -print

          else

            echo "No bin directory was created."

          fi


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
```
