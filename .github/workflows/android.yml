name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      # Use an NDK version that is compatible with the
      # Python 3.12 Android build.
      ANDROID_NDK_VERSION: "27c"

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # JAVA
      # ======================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # BUILD DEPENDENCIES
      # ======================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      # ======================================================
      # BUILDOZER
      # ======================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.4"
          python -m pip install buildozer


      # ======================================================
      # CLEAN OLD BUILD
      # ======================================================

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build Android APK
        env:
          P4A_NDK_VERSION: "27c"
        run: |
          buildozer -v android debug


      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
