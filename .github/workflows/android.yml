name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"

      - name: Check project
        run: |
          set -e

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo "Project files found."
          echo "Assets:"
          find assets -maxdepth 1 -type f | wc -l

      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Show Buildozer configuration
        run: |
          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          grep -n "p4a\." buildozer.spec || true

      - name: Build APK
        run: |
          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "No bin directory was created."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
