name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Refresh autotools
        run: |
          libtoolize --version
          autoreconf --version
          automake --version
          autoconf --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.4"
          python -m pip install buildozer

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Show APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
