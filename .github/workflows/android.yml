name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # JAVA
      # ======================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      # ======================================================
      # INSTALL BUILDOZER
      # ======================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<70"
          python -m pip install "virtualenv<21"
          python -m pip install "cython==3.0.11"
          python -m pip install "buildozer==1.5.0"


      # ======================================================
      # VERIFY BUILD TOOLS
      # ======================================================

      - name: Show build tool versions
        run: |
          python --version
          pip --version
          virtualenv --version
          cython --version
          buildozer --version


      # ======================================================
      # CLEAN EVERYTHING
      # ======================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build Android APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          buildozer -v android debug


      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find APK
        run: |
          echo "======================================"
          echo "APK OUTPUT"
          echo "======================================"

          find bin -type f -name "*.apk" -print


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
