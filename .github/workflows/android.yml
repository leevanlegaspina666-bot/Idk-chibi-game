name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.11
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. ANDROID / BUILD DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      # ============================================================
      # 5. BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"


      # ============================================================
      # 6. CHECK HOST TOOLS
      # ============================================================

      - name: Check build tools
        run: |
          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version


      # ============================================================
      # 7. CLEAN OLD BUILDOZER DATA
      # ============================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf p4a-local


      # ============================================================
      # 8. DOWNLOAD PYTHON-FOR-ANDROID
      # ============================================================

      - name: Download python-for-android
        run: |
          git clone \
            --depth 1 \
            --branch master \
            https://github.com/kivy/python-for-android.git \
            p4a-local

          echo
          echo "========================================"
          echo "P4A COMMIT"
          echo "========================================"

          cd p4a-local
          git rev-parse HEAD

          echo
          echo "P4A BUILD FILE:"
          ls -lh pythonforandroid/build.py


      # ============================================================
      # 9. PATCH THE ACTUAL P4A FILE
      #
      # TWO fixes are applied:
      #
      # A) Create the temporary venv with --clear.
      #
      # B) Do NOT run:
      #
      #       pip install -U pip
      #
      # That second command is the command producing the
      # open_rich_spinner ImportError in your build.
      # ============================================================

      - name: Patch python-for-android pip setup
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("p4a-local/pythonforandroid/build.py")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: p4a build.py does not exist."
              )

          text = path.read_text()

          print("========================================")
          print("CHECKING P4A BEFORE PATCH")
          print("========================================")

          if "pip install -U pip" not in text:
              raise SystemExit(
                  "ERROR: Expected p4a pip upgrade command was not found."
              )

          if "host_python, '-m', 'venv', 'venv'" not in text:
              raise SystemExit(
                  "ERROR: Expected p4a venv creation command was not found."
              )

          # --------------------------------------------------------
          # FIX A:
          # venv -> venv --clear
          # --------------------------------------------------------

          text = text.replace(
              "shprint(host_python, '-m', 'venv', 'venv')",
              "shprint(host_python, '-m', 'venv', '--clear', 'venv')",
              1,
          )

          # --------------------------------------------------------
          # FIX B:
          # Remove the pip self-upgrade that causes the crash.
          #
          # Replace the exact shprint(...) block with a harmless
          # pip version check.
          # --------------------------------------------------------

          old_block = """        info('Upgrade pip to latest version')
          shprint(sh.bash, '-c', (
              "source venv/bin/activate && pip install -U pip"
          ), _env=copy.copy(base_env))
          """

          new_block = """        info('Using clean venv pip without self-upgrade')
          shprint(sh.bash, '-c', (
              "venv/bin/python -m pip --version"
          ), _env=copy.copy(base_env))
          """

          if old_block not in text:
              raise SystemExit(
                  "ERROR: Expected pip upgrade block was not found. "
                  "The p4a source layout has changed; stopping instead "
                  "of pretending the patch worked."
              )

          text = text.replace(
              old_block,
              new_block,
              1,
          )

          path.write_text(text)

          print()
          print("========================================")
          print("P4A PATCH APPLIED")
          print("========================================")

          print("Venv clear:",
                "'--clear', 'venv'" in text)

          print("Old pip upgrade removed:",
                "pip install -U pip" not in text)

          if "'--clear', 'venv'" not in text:
              raise SystemExit(
                  "ERROR: Venv --clear patch was NOT applied."
              )

          if "pip install -U pip" in text:
              raise SystemExit(
                  "ERROR: pip self-upgrade was NOT removed."
              )

          print()
          print("SUCCESS: Both p4a fixes are present.")
          PY


      # ============================================================
      # 10. SHOW THE PATCHED SECTION
      #
      # This is deliberately visible in Actions so we can verify
      # the exact code before the expensive Android build starts.
      # ============================================================

      - name: Verify patched p4a
        run: |
          echo "========================================"
          echo "PATCHED P4A SECTION"
          echo "========================================"

          grep -n -A18 -B5 \
            "Using clean venv pip" \
            p4a-local/pythonforandroid/build.py

          echo
          echo "========================================"
          echo "PATCH CHECK"
          echo "========================================"

          grep -n \
            "'--clear', 'venv'" \
            p4a-local/pythonforandroid/build.py

          if grep -q "pip install -U pip" \
            p4a-local/pythonforandroid/build.py; then

            echo "ERROR: Old pip upgrade still exists."
            exit 1
          fi

          echo "SUCCESS: Old pip upgrade is gone."


      # ============================================================
      # 11. CONFIGURE BUILDOZER TO USE PATCHED P4A
      # ============================================================

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          lines = []

          for line in text.splitlines():
              if line.strip().startswith("p4a.source_dir"):
                  continue

              lines.append(line)

          lines.append("")
          lines.append("# GitHub Actions patched python-for-android")
          lines.append("p4a.source_dir = ./p4a-local")

          path.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          echo
          echo "========================================"
          echo "BUILDOZER P4A SETTINGS"
          echo "========================================"

          grep -n "p4a." buildozer.spec


      # ============================================================
      # 12. PIP ENVIRONMENT
      # ============================================================

      - name: Configure pip
        run: |
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=1" >> "$GITHUB_ENV"


      # ============================================================
      # 13. CHECK PROJECT
      # ============================================================

      - name: Check project files
        run: |
          echo "========================================"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo "main.py found"
          echo "buildozer.spec found"
          echo "assets folder found"

          echo
          echo "Asset count:"

          find assets -maxdepth 1 -type f \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            | wc -l


      # ============================================================
      # 14. BUILD APK
      # ============================================================

      - name: Build Android APK
        run: |
          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # 15. FIND APK
      # ============================================================

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "bin directory was not created."
          fi


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
