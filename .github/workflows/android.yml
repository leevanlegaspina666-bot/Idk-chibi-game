name: Build Chibi Shark Pet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON 3.11
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext


      # ============================================================
      # 5. INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==3.0.11" \
            "virtualenv==20.31.2" \
            "setuptools<70"


      # ============================================================
      # 6. CHECK HOST TOOLS
      # ============================================================

      - name: Check build environment
        run: |
          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version

          echo
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version


      # ============================================================
      # 7. CLEAN PREVIOUS BUILDS
      # ============================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf p4a-local


      # ============================================================
      # 8. DOWNLOAD FIXED PYTHON-FOR-ANDROID
      #
      # Commit 5865575:
      # "Remove venv creation for python package install stage"
      #
      # This directly addresses the broken temporary pip/venv
      # stage that produced:
      #
      # ImportError: cannot import name 'open_rich_spinner'
      # ============================================================

      - name: Download fixed python-for-android
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING PYTHON-FOR-ANDROID"
          echo "========================================"

          git clone \
            --filter=blob:none \
            https://github.com/kivy/python-for-android.git \
            p4a-local

          cd p4a-local

          git checkout 5865575

          echo
          echo "========================================"
          echo "P4A COMMIT"
          echo "========================================"

          git rev-parse HEAD


      # ============================================================
      # 9. VERIFY THE EXACT P4A VERSION
      #
      # IMPORTANT:
      # Do NOT compare the full 40-character hash to "5865575".
      # We check the beginning of the full hash instead.
      # ============================================================

      - name: Verify fixed python-for-android
        shell: bash
        run: |
          set -e

          cd p4a-local

          echo "========================================"
          echo "VERIFYING P4A"
          echo "========================================"

          COMMIT="$(git rev-parse HEAD)"

          echo "Full commit:"
          echo "$COMMIT"

          if [[ "$COMMIT" != 5865575* ]]; then
            echo
            echo "ERROR: The wrong p4a commit was checked out."
            exit 1
          fi

          echo
          echo "SUCCESS: Correct p4a commit is installed."


      # ============================================================
      # 10. VERIFY THE ACTUAL FIX
      #
      # The fixed commit removes the old temporary venv creation
      # from the Python package installation stage.
      #
      # We also make sure the exact crashing command is absent.
      # ============================================================

      - name: Verify p4a pip fix
        shell: bash
        run: |
          set -e

          FILE="p4a-local/pythonforandroid/build.py"

          echo "========================================"
          echo "VERIFYING P4A BUILD CODE"
          echo "========================================"

          test -f "$FILE"

          echo
          echo "Checking for old pip self-upgrade..."

          if grep -q "pip install -U pip" "$FILE"; then
            echo
            echo "ERROR: The broken pip self-upgrade is still present."
            echo
            grep -n -B3 -A5 "pip install -U pip" "$FILE" || true
            exit 1
          fi

          echo
          echo "SUCCESS: The old pip self-upgrade is absent."

          echo
          echo "Checking for old temporary venv creation..."

          if grep -q "host_python.*-m.*venv.*'venv'" "$FILE"; then
            echo
            echo "WARNING: A venv reference still exists in build.py."
            echo "This may be unrelated to the package-install stage."
            echo
          else
            echo "No old package-install venv creation found."
          fi


      # ============================================================
      # 11. CONFIGURE BUILDOZER
      #
      # Buildozer officially supports p4a.source_dir.
      # ============================================================

      - name: Configure Buildozer p4a source
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit(
                  "ERROR: buildozer.spec was not found."
              )

          text = path.read_text()

          lines = []

          for line in text.splitlines():

              # Remove any old p4a.source_dir.
              if line.strip().startswith("p4a.source_dir"):
                  continue

              lines.append(line)

          lines.append("")
          lines.append("# GitHub Actions: fixed python-for-android")
          lines.append("p4a.source_dir = ./p4a-local")

          path.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          echo
          echo "========================================"
          echo "BUILDOZER P4A CONFIGURATION"
          echo "========================================"

          grep -n "p4a." buildozer.spec


      # ============================================================
      # 12. PIP SETTINGS
      # ============================================================

      - name: Configure pip
        run: |
          echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "PIP_NO_CACHE_DIR=1" >> "$GITHUB_ENV"


      # ============================================================
      # 13. CHECK PROJECT
      # ============================================================

      - name: Check project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f main.py
          test -f buildozer.spec
          test -d assets

          echo
          echo "main.py:"
          ls -lh main.py

          echo
          echo "buildozer.spec:"
          ls -lh buildozer.spec

          echo
          echo "Assets:"
          find assets -maxdepth 1 -type f -print | sort

          echo
          echo "Image count:"

          find assets -maxdepth 1 -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
            \) | wc -l


      # ============================================================
      # 14. BUILD APK
      # ============================================================

      - name: Build Android APK
        run: |
          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          buildozer -v android debug


      # ============================================================
      # 15. FIND APK
      # ============================================================

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -type f -name "*.apk" -print
          else
            echo "No bin directory was created."
          fi


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChibiSharkPet-APK
          path: bin/*.apk
          if-no-files-found: error
